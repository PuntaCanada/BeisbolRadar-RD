name: Portal CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: node --check public/app.js && node --check public/stats.js
      - run: python3 -m py_compile scripts/*.py
      - run: pip install playwright==1.56.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/browser.py
      - run: |
          if test -f public/data/players.json; then
            python3 scripts/verify_history.py public/data
            python3 tests/stats_browser.py
          fi
  history-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 scripts/download_history.py
      - run: python3 scripts/verify_history.py review-history
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-history
          path: review-history/
          if-no-files-found: error
      - name: Persist independently reviewed data on development branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/portal-foundation'
        run: |
          cp review-history/{players.json,history.json,lahman-readme.txt,provenance.json} public/data/
          git add public/data/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Persist independently verified historical data'
            git push origin HEAD:refs/heads/feat/portal-foundation
          fi

name: Portal CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/verify_history.py public/data
      - run: python3 -m unittest discover -s tests -v
      - run: node --check public/app.js && node --check public/stats.js
      - run: python3 -m py_compile scripts/*.py
      - run: pip install playwright==1.56.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/browser.py
      - run: python3 tests/stats_browser.py
